<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K12TutorAgent · AI 教学助教</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ═══════════ 登录视图 ═══════════ -->
  <div id="view-login" class="login-wrap hidden">
    <div class="login-card">
      <div class="brand">
        <div class="brand-logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
            <path d="M8 9h8M8 13h5"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1>K12TutorAgent</h1>
          <p>AI 教学助教 · 多 Agent 智能辅助系统</p>
        </div>
      </div>

      <form id="login-form" class="login-form" autocomplete="off">
        <label class="field">
          <span class="field-label">用户名 / 邮箱</span>
          <input type="text" id="login-username" placeholder="teacher01 或 student01" required>
        </label>
        <label class="field">
          <span class="field-label">密码</span>
          <input type="password" id="login-password" placeholder="Teacher@123456" required>
        </label>
        <button type="submit" class="btn btn-primary btn-block" id="login-btn">登 录</button>
        <p class="login-error" id="login-error"></p>
      </form>

      <div class="login-hint">
        <span class="hint-tag">演示账号</span>
        <div class="hint-row" data-u="teacher01" data-p="Teacher@123456">
          <b>teacher01</b> <code>Teacher@123456</code> <span class="hint-role role-teacher">教师</span>
        </div>
        <div class="hint-row" data-u="student01" data-p="Student@123456">
          <b>student01</b> <code>Student@123456</code> <span class="hint-role role-student">学生</span>
        </div>
      </div>
    </div>
  </div>

  <!-- ═══════════ 主应用布局 ═══════════ -->
  <div id="app" class="app hidden">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-logo brand-logo-sm">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
            <path d="M8 9h8M8 13h5"/>
          </svg>
        </div>
        <span>K12TutorAgent</span>
      </div>

      <nav class="nav" id="nav"></nav>

      <div class="sidebar-footer">
        <div class="user-chip">
          <div class="avatar" id="user-avatar">T</div>
          <div class="user-meta">
            <span class="user-name" id="user-name">—</span>
            <span class="user-role" id="user-role">—</span>
          </div>
        </div>
        <button class="btn btn-ghost btn-block" id="logout-btn">退出登录</button>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <h2 class="page-title" id="page-title">AI 助手</h2>
        <div class="topbar-right">
          <span class="badge" id="role-badge"></span>
        </div>
      </header>

      <main class="content">
        <section id="view-chat" class="view"></section>
        <section id="view-exam" class="view hidden"></section>
        <section id="view-lesson-prep" class="view hidden"></section>
        <section id="view-learning-analysis" class="view hidden"></section>
        <section id="view-homework" class="view hidden"></section>
      </main>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
