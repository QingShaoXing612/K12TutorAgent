<svg xmlns="http://www.w3.org/2000/svg" width="940" height="560" viewBox="0 0 940 560" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="940" height="560" fill="#ffffff"/>

  <!-- ══════════ ① 前端 ══════════ -->
  <rect x="30" y="14" width="880" height="58" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="46" y="36" font-size="13" font-weight="700" fill="#b45309">① 前端 · SPA</text>
  <rect x="60" y="42" width="820" height="22" rx="6" fill="#ffffff" stroke="#fbbf24"/>
  <text x="470" y="57" font-size="12" fill="#78350f" text-anchor="middle">统一聊天入口 + 各功能页（/chat · /exam · /lesson-prep · /learning-analysis · /homework）</text>

  <!-- ══════════ ② API 层 ══════════ -->
  <rect x="30" y="88" width="880" height="92" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="46" y="110" font-size="13" font-weight="700" fill="#1d4ed8">② API 层 · FastAPI（/api/v1）</text>

  <rect x="60" y="118" width="360" height="50" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="240" y="140" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">unified_chat 统一入口</text>
  <text x="240" y="156" font-size="10.5" fill="#475569" text-anchor="middle">SSE 意图路由（规则 + LLM 分类）</text>

  <rect x="520" y="118" width="360" height="50" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="700" y="140" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">REST 业务路由</text>
  <text x="700" y="156" font-size="10.5" fill="#475569" text-anchor="middle">auth · qa · exam · lesson_prep · learning_analysis · homework</text>

  <!-- ══════════ ③ 编排 + Agent 层 ══════════ -->
  <rect x="30" y="196" width="880" height="126" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="46" y="216" font-size="13" font-weight="700" fill="#15803d">③ 编排 + Agent 层 · LangGraph 状态机</text>

  <rect x="44" y="226" width="180" height="76" rx="8" fill="#ffffff" stroke="#86efac"/>
  <text x="134" y="250" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">supervisor / orchestrator</text>
  <text x="134" y="270" font-size="10" fill="#475569" text-anchor="middle">LLM 决策路由</text>
  <text x="134" y="286" font-size="10" fill="#475569" text-anchor="middle">+ 图懒加载缓存</text>

  <rect x="236" y="226" width="156" height="76" rx="8" fill="#ffffff" stroke="#86efac"/>
  <text x="314" y="250" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">qa · 10 节点</text>
  <text x="314" y="270" font-size="10" fill="#475569" text-anchor="middle">智能问答</text>
  <text x="314" y="286" font-size="10" fill="#16a34a" text-anchor="middle">RAG / 联网</text>

  <rect x="400" y="226" width="156" height="76" rx="8" fill="#ffffff" stroke="#86efac"/>
  <text x="478" y="250" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">exam · 9 节点</text>
  <text x="478" y="270" font-size="10" fill="#475569" text-anchor="middle">试卷批改</text>
  <text x="478" y="286" font-size="10" fill="#16a34a" text-anchor="middle">+ 教师复核</text>

  <rect x="564" y="226" width="156" height="76" rx="8" fill="#ffffff" stroke="#86efac"/>
  <text x="642" y="250" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">lesson_prep · 10 节点</text>
  <text x="642" y="270" font-size="10" fill="#475569" text-anchor="middle">智能备课</text>
  <text x="642" y="286" font-size="10" fill="#16a34a" text-anchor="middle">+ 反思回炉</text>

  <rect x="728" y="226" width="164" height="76" rx="8" fill="#ffffff" stroke="#86efac"/>
  <text x="810" y="250" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">learning_analysis · 10 节点</text>
  <text x="810" y="270" font-size="10" fill="#475569" text-anchor="middle">学情报告</text>
  <text x="810" y="286" font-size="10" fill="#16a34a" text-anchor="middle">3 个跨 Agent seam</text>

  <!-- ══════════ ④ 共享能力层 ══════════ -->
  <rect x="30" y="338" width="880" height="92" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="46" y="358" font-size="13" font-weight="700" fill="#6d28d9">④ 共享能力层 · backend/core</text>
  <text x="896" y="358" font-size="10" fill="#6d28d9" text-anchor="end">MCP：/mcp/kb · /mcp/web-search</text>

  <rect x="60" y="368" width="300" height="50" rx="8" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="210" y="390" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">knowledge_base（RAG）</text>
  <text x="210" y="406" font-size="10.5" fill="#475569" text-anchor="middle">BGE-M3 嵌入 + Milvus 召回 + Reranker 精排</text>

  <rect x="580" y="368" width="300" height="50" rx="8" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="730" y="390" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">llm_factory</text>
  <text x="730" y="406" font-size="10.5" fill="#475569" text-anchor="middle">DeepSeek 统一路由（langchain-openai）</text>

  <!-- ══════════ ⑤ 数据层 ══════════ -->
  <rect x="30" y="446" width="880" height="98" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="46" y="466" font-size="13" font-weight="700" fill="#b91c1c">⑤ 数据层</text>

  <rect x="60" y="476" width="300" height="50" rx="8" fill="#ffffff" stroke="#fca5a5"/>
  <text x="210" y="498" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">Milvus</text>
  <text x="210" y="514" font-size="10.5" fill="#475569" text-anchor="middle">向量检索（BGE-M3 dense + sparse）</text>

  <rect x="380" y="476" width="180" height="50" rx="8" fill="#ffffff" stroke="#fca5a5"/>
  <text x="470" y="498" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">PostgreSQL</text>
  <text x="470" y="514" font-size="10.5" fill="#475569" text-anchor="middle">业务表 + 检查点</text>

  <rect x="580" y="476" width="300" height="50" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-dasharray="4,3"/>
  <text x="730" y="498" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">DeepSeek（外部）</text>
  <text x="730" y="514" font-size="10.5" fill="#475569" text-anchor="middle">LLM API</text>

  <!-- ══════════ 箭头 ══════════ -->
  <!-- 前端 → API 层 -->
  <line x1="240" y1="72" x2="240" y2="116" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="248" y="98" font-size="10" fill="#64748b">SSE / 聊天</text>
  <line x1="700" y1="72" x2="700" y2="116" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="708" y="98" font-size="10" fill="#64748b">REST</text>

  <!-- unified_chat → supervisor（意图路由） -->
  <line x1="160" y1="168" x2="160" y2="224" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="168" y="202" font-size="10" fill="#64748b">意图路由</text>

  <!-- supervisor → agents（调度，横向） -->
  <line x1="224" y1="264" x2="234" y2="264" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- REST → agents（直达） -->
  <line x1="700" y1="168" x2="700" y2="224" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="708" y="202" font-size="10" fill="#64748b">REST 直达</text>

  <!-- qa → RAG -->
  <line x1="300" y1="302" x2="300" y2="366" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="308" y="340" font-size="10" fill="#64748b">RAG 检索</text>

  <!-- agents → llm_factory -->
  <line x1="800" y1="302" x2="800" y2="366" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="808" y="340" font-size="10" fill="#64748b">LLM 调用</text>

  <!-- agents → PostgreSQL（业务数据 / 检查点，经能力层中间空道） -->
  <line x1="470" y1="302" x2="470" y2="474" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="478" y="392" font-size="10" fill="#64748b">业务数据 / 检查点</text>

  <!-- RAG → Milvus -->
  <line x1="210" y1="418" x2="210" y2="474" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="218" y="452" font-size="10" fill="#64748b">向量检索</text>

  <!-- llm_factory → DeepSeek -->
  <line x1="730" y1="418" x2="730" y2="474" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="738" y="452" font-size="10" fill="#64748b">DeepSeek API</text>

  <!-- learning_analysis ⇢ lesson_prep（seam① 一键备课） -->
  <line x1="794" y1="220" x2="642" y2="220" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
  <text x="718" y="212" font-size="9.5" fill="#b45309" text-anchor="middle">seam① 一键备课</text>
</svg>
